<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="logo">ApplyTrack</a>
    <nav>
      <a href="{{ url_for('index') }}">Applications</a>
      <a href="{{ url_for('new_application') }}" class="btn btn-primary">+ New application</a>
    </nav>
  </header>

  <main class="container">
    {# Flash messages: feedback after each action (NFR1 usability) #}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
